name: Import BUILD119 source

on:
  push:
    branches: [main]
    paths:
      - '.source-upload/READY'
      - '.github/workflows/import-build119.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip until all chunks are uploaded
        shell: bash
        run: |
          if [ ! -f .source-upload/READY ]; then
            echo "Upload not complete yet."
            exit 0
          fi

      - name: Reconstruct and import BUILD119 source
        shell: bash
        run: |
          set -euo pipefail
          cat .source-upload/src-*.b64 | base64 --decode > /tmp/build119_source.tar.xz
          echo "c2c573499d017461cce365939e1236bf26e4a53bae99fafcadc6621ee20e5b5f  /tmp/build119_source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/build119_source.tar.xz -C .

          cat .source-upload/icon-*.b64 | base64 --decode > /tmp/app_icon.png
          echo "ad4943ae58c7b728ce6c6a8163a20c6bac04ade470dd8b2e3fa4c290fe26c737  /tmp/app_icon.png" | sha256sum -c -
          mkdir -p app/src/main/assets app/src/main/res/drawable-nodpi
          cp /tmp/app_icon.png app/src/main/assets/app_icon.png
          cp /tmp/app_icon.png app/src/main/res/drawable-nodpi/app_icon.png

          rm -rf .source-upload
          rm -f .github/workflows/import-build119.yml

      - name: Verify public tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -d signing
          ! find . -type f \( -name '*.p12' -o -name '*.pfx' -o -name '*.jks' -o -name '*.keystore' -o -name 'keystore.properties' -o -name '*.apk' -o -name '*.aab' \) | grep -q .
          grep -q 'versionCode 119' app/build.gradle
          grep -q 'versionName "3.6.9"' app/build.gradle
          test -f app/src/main/assets/global_shortage_v369.js

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Build Import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Release v3.6.9 BUILD119 - Global Shortage Early Warning"
          git push origin HEAD:main
