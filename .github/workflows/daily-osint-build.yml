name: Build Daily OSINT APK
on:
  push:
    branches:
      - daily-osint-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Find Android sdkmanager
        id: androidsdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          "$SDKMANAGER" --version
      - name: Accept licenses and install SDK 36
        run: |
          SDKMANAGER="${{ steps.androidsdk.outputs.sdkmanager }}"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Restore source archive
        run: |
          cat daily-osint-build/chunk_00 daily-osint-build/chunk_01 daily-osint-build/chunk_02 daily-osint-build/chunk_03 daily-osint-build/chunk_04 > /tmp/dailyosint_source.b64
          test "$(wc -c < /tmp/dailyosint_source.b64)" -eq 26188
          base64 -d /tmp/dailyosint_source.b64 > /tmp/daily-osint.zip
          echo "2204ca57213bd0c458faba460d3ead0bdaa558f8cf78ab14081182774134543a  /tmp/daily-osint.zip" | sha256sum -c -
          unzip -q /tmp/daily-osint.zip -d /tmp/daily-osint
      - name: Apply confirmed build compatibility fixes
        working-directory: /tmp/daily-osint/DailyOSINTIntelligence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("build.gradle.kts")
          s = root.read_text()
          replacements = {
              'id("com.android.application") version "8.7.3" apply false':
                  'id("com.android.application") version "8.9.1" apply false',
              'id("org.jetbrains.kotlin.android") version "2.0.21" apply false':
                  'id("org.jetbrains.kotlin.android") version "2.2.0" apply false',
              'id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false':
                  'id("org.jetbrains.kotlin.plugin.compose") version "2.2.0" apply false',
              'id("com.google.devtools.ksp") version "2.0.21-1.0.28" apply false':
                  'id("com.google.devtools.ksp") version "2.2.0-2.0.2" apply false',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f"Expected build line not found: {old}")
              s = s.replace(old, new)
          root.write_text(s)

          app = Path("app/build.gradle.kts")
          s = app.read_text()
          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""",
                  1,
              )
          app.write_text(s)
          PY

          grep -E 'com.android.application|org.jetbrains.kotlin.android|org.jetbrains.kotlin.plugin.compose|com.google.devtools.ksp' build.gradle.kts
          grep -q 'org.jetbrains.kotlin.android") version "2.2.0"' build.gradle.kts
          grep -q 'org.jetbrains.kotlin.plugin.compose") version "2.2.0"' build.gradle.kts
          grep -q 'com.google.devtools.ksp") version "2.2.0-2.0.2"' build.gradle.kts
          grep -A4 'compileOptions' app/build.gradle.kts
      - name: Unit tests and debug APK
        working-directory: /tmp/daily-osint/DailyOSINTIntelligence
        run: |
          gradle --no-daemon test
          gradle --no-daemon assembleDebug
      - name: Prepare artifact
        run: |
          mkdir -p out
          cp /tmp/daily-osint/DailyOSINTIntelligence/app/build/outputs/apk/debug/app-debug.apk out/DailyOSINTIntelligence_v1.0.0_debug.apk
          sha256sum out/DailyOSINTIntelligence_v1.0.0_debug.apk > out/SHA256.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyOSINTIntelligence-v1.0.0-debug
          path: out/
          if-no-files-found: error
